    .daily-report-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:16px 0}.daily-kpi{padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--surface2)}.daily-kpi span,.daily-kpi small{display:block;color:var(--muted);font-size:10px}.daily-kpi strong{display:block;margin:7px 0;font-size:20px;color:var(--gold2)}.daily-charts{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:16px}.daily-chart{padding:16px;border:1px solid var(--line);border-radius:11px;background:var(--surface2)}.daily-chart h3{margin:0 0 14px;font-size:13px}.chart-bars{display:grid;gap:10px}.chart-row{display:grid;grid-template-columns:100px 1fr 76px;align-items:center;gap:8px;font-size:10px}.chart-label{overflow:hidden;color:var(--soft);text-overflow:ellipsis;white-space:nowrap}.chart-track{height:12px;overflow:hidden;border-radius:20px;background:var(--surface3)}.chart-fill{height:100%;min-width:2px;border-radius:20px;background:linear-gradient(90deg,var(--burgundy2),var(--gold))}.chart-value{color:var(--gold2);font-size:10px;text-align:left}.daily-table{max-height:220px;margin-top:16px;overflow:auto;border:1px solid var(--line);border-radius:10px}.daily-table table{width:100%;border-collapse:collapse;font-size:10px}.daily-table th,.daily-table td{padding:9px;text-align:right;border-bottom:1px solid var(--line)}.daily-table th{color:var(--gold2);background:var(--surface2)}.daily-table td{color:var(--soft)}@media(max-width:800px){.daily-report-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.daily-charts{grid-template-columns:1fr}.chart-row{grid-template-columns:82px 1fr 70px}}

    /* Cart */
    .cart{display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,var(--surface),rgba(144,12,63,.025));border-right:1px solid var(--line);box-shadow:-10px 0 35px rgba(0,0,0,.08)}.cart-head{display:flex;align-items:flex-end;justify-content:space-between;padding:30px 24px 18px;border-bottom:1px solid var(--line)}.cart-badge{padding:5px 8px;color:var(--gold2);background:rgba(213,175,114,.1);border:1px solid rgba(213,175,114,.17);border-radius:5px;font-size:9px}.cart-controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:16px 24px 12px}.cart-controls button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:31px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:6px;font-size:9px}.cart-controls button:hover{color:var(--soft);border-color:var(--line2)}.held{color:var(--gold)!important;border-color:rgba(213,175,114,.32)!important}.cart-list{flex:1;min-height:260px;max-height:calc(100vh - 370px);overflow-y:auto;padding:0 24px}.cart-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid var(--line);animation:up .24s var(--ease) both}.line-leading{display:flex;align-items:center;gap:9px;min-width:0}.line-leading>div{min-width:0}.line-leading strong,.line-leading small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.line-leading strong{font-size:11px}.line-leading small{margin-top:4px;color:var(--muted);font-size:9px}.remove{display:grid;place-items:center;width:25px;height:25px;color:var(--muted2);background:transparent;border-radius:6px}.remove:hover{color:var(--danger);background:rgba(240,113,121,.09)}.line-total{color:var(--green);font-size:11px;font-weight:800;white-space:nowrap}.return-total{color:var(--danger)}.empty-cart{display:flex;min-height:250px;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center}.empty-cart .empty-icon{display:grid;p     function parseCSVLine(line){const cells=[];let cell='',quoted=false;for(let i=0;i<line.length;i++){const ch=line[i];if(ch==='"'&&line[i+1]==='"'){cell+='"';i++;continue;}if(ch==='"'){quoted=!quoted;continue;}if(ch===','&&!quoted){cells.push(cell.trim());cell='';continue;}cell+=ch;}cells.push(cell.trim());return cells;}
    function importCSV(file){if(state.user!=='admin')return toast('استيراد المخزون متاح للأدمن فقط',true);const reader=new FileReader();reader.onload=()=>{const rows=String(reader.result||'').split(/\r?\n/).map(r=>r.trim()).filter(Boolean);if(!rows.length)return;const header=parseCSVLine(rows[0]).map(v=>v.toLowerCase());const hasHeader=header.some(v=>/barcode|باركود/.test(v));const idx={branch:hasHeader?Math.max(0,header.findIndex(v=>/branch|فرع/.test(v))):-1,barcode:hasHeader?header.findIndex(v=>/barcode|باركود/.test(v)):0,name:hasHeader?header.findIndex(v=>/name|اسم/.test(v)):1,price:hasHeader?header.findIndex(v=>/price|سعر/.test(v)):2,quantity:hasHeader?header.findIndex(v=>/quantity|stock|كمية|مخزون/.test(v)):3};const imported=[];rows.slice(hasHeader?1:0).forEach(row=>{const cells=parseCSVLine(row),branch=String(idx.branch>=0?cells[idx.branch]||state.branch:state.branch).trim()||state.branch,barcode=String(cells[idx.barcode]||'').trim(),name=String(cells[idx.name]||'').trim(),price=Number(cells[idx.price]),quantity=Number(cells[idx.quantity]);if(!barcode||!name||!Number.isFinite(price)||price<=0)return;if(!state.branches.includes(branch))state.branches.push(branch);const category=String(cells[hasHeader?header.findIndex(v=>/category|تصنيف|نوع/.test(v)):-1]||'عام').trim()||'عام';imported.push({branch,barcode,name,price,quantity:Number.isFinite(quantity)&&quantity>=0?quantity:0,category})});const byKey=new Map(state.products.map(p=>[`${p.branch||state.branch}::${p.barcode}`,p]));imported.forEach(p=>byKey.set(`${p.branch}::${p.barcode}`,p));state.products=[...byKey.values()];save();render();toast(`تم استيراد ${imported.length} صنفاً موزعاً على الفروع`)};reader.readAsText(file,'UTF-8');}
    function saveProduct(form){if(state.user!=='admin')return toast('إدارة المخزون متاحة للأدمن فقط',true);const data=new FormData(form),barcode=String(data.get('barcode')||'').trim(),name=String(data.get('name')||'').trim(),category=String(data.get('category')||'عام').trim()||'عام',price=Number(data.get('price')),quantity=Number(data.get('quantity'));if(!barcode||!name||!Number.isFinite(price)||price<=0||!Number.isFinite(quantity)||quantity<0)return toast('أدخل الباركود والاسم والسعر والكمية بشكل صحيح',true);const existing=state.products.find(p=>String(p.barcode)===barcode&&(!p.branch||p.branch===state.branch));if(existing)Object.assign(existing,{name,category,price,quantity,branch:state.branch});else state.products.push({barcode,name,category,price,quantity,branch:state.branch});save();state.modal='inventory';render();toast(existing?'تم تحديث المنتج والمخزون':'تمت إضافة المنتج بنجاح');}
    function adjustStock(barcode){if(state.user!=='admin')return toast('الجرد متاح للأدمن فقط',true);const product=state.products.find(p=>String(p.barcode)===String(barcode)&&(!p.branch||p.branch===state.branch));if(!product)return;const raw=prompt(`الكمية الفعلية الحالية للصنف ${product.name}:`,String(product.quantity||0));if(raw===null)return;const quantity=Number(raw);if(!Number.isInteger(quantity)||quantity<0)return toast('أدخل كمية صحيحة تساوي صفرًا أو أكثر',true);const previous=Number(product.quantity)||0;product.quantity=quantity;save();render();if(quantity!==previous)syncInventoryMovementToCloud(product,'adjustment',quantity-previous,quantity,`manual-count-${Date.now()}`);toast(`تم تحديث جرد ${product.name} من ${previous} إلى ${quantity}`)}
    function deleteProduct(barcode){if(state.user!=='admin')return toast('إدارة المخزون متاحة للأدمن فقط',true);const product=state.products.find(p=>String(p.barcode)===String(barcode));if(!product)return;if(!confirm(`حذف ${product.name} من الكتالوج؟`))return;state.products=state.products.filter(p=>String(p.barcode)!==String(barcode));save();render();toast('تم حذف المنتج');}
    function exportCSV(){if(state.user!=='admin')return toast('تصدير المخزون متاح للأدمن فقط',true);const header='branch,barcode,name,category,price,quantity\\n';const body=state.products.map(p=>[p.branch||state.branch,p.barcode,p.name,p.category||'عام',p.price,p.quantity].map(v=>`"${String(v??'').replace(/"/g,'""')}"`).join(',')).join('\\n');const blob=new Blob([header+body+'\\n'],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`dh-inventory-${new Date().toISOString().slice(0,10)}.csv`;a.click();URL.revokeObjectURL(url);toast('تم تصدير كتالوج المخزون بصيغة CSV');}

    function dailyReportData(){
      const today=dateLabel();
      const transactions=(state.transactions||[]).filter(t=>!t.date||t.date===today);
      const byPayment={};payments.forEach(p=>byPayment[p.name]=0);
      const products={};let units=0;
      transactions.forEach(t=>{const service=t.service||'نقدي';byPayment[service]=Number(byPayment[service]||0)+Number(t.total||0);(t.items||[]).forEach(i=>{const key=i.name||'أسعار سريعة';products[key]=Number(products[key]||0)+Number(i.price||0)*Number(i.qty||0);units+=Number(i.qty||0);});});
      const paymentRows=Object.entries(byPayment).filter(([,value])=>value>0).sort((a,b)=>b[1]-a[1]);
      const productRows=Object.entries(products).sort((a,b)=>b[1]-a[1]).slice(0,8);
      return {today,transactions,total:transactions.reduce((s,t)=>s+Number(t.total||0),0),units,byPayment,paymentRows,productRows};
    }

      if(state.modal==='admin') return `<div class="backdrop"><section class="modal wide"><div class="modal-head"><div class="modal-title"><span>♙</span><h2>إدارة المستخدمين</h2></div><button class="icon-btn" data-action="close">×</button></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:var(--muted);font-size:11px"><span>${Object.keys(state.users).length} حسابات مسجلة</span><button class="outline" data-action="add-user">＋ إضافة كاشير</button></div><div class="setting" style="margin-bottom:14px"><div><strong>فرع الفاتورة الحالي</strong><small>يظهر اسم الفرع المختار في كل فاتورة جديدة</small></div><div class="inline"><select data-input="branch" style="min-height:32px;padding:0 8px;color:var(--text);background:var(--surface2);border:1px solid var(--line2);border-radius:7px">${state.branches.map(b=>`<option value="${esc(b)}" ${state.branch===b?'selected':''}>${esc(b)}</option>`).join('')}</select><button data-action="add-branch">＋ فرع</button></div></div><div class="user-list">${Object.keys(state.users).map(name=>`<div class="user-row"><div class="user-info"><span class="avatar">${name==='admin'?'⌘':esc(initial(name))}</span><span><b>${esc(name)}</b><small>${name==='admin'?'مدير النظام':state.users[name]?'محمي بكلمة مرور':'دخول سريع'}</small></span></div><div class="row-actions"><button data-action="password" data-user="${esc(name)}">كلمة السر</button>${name!=='admin'?`<button data-action="expense-permission" data-user="${esc(name)}">${(state.expenseManagers||[]).includes(name)?'سحب المصاريف':'منح المصاريف'}</button><button data-action="payment-permission" data-user="${esc(name)}">${(state.paymentManagers||[]).includes(name)?'سحب استبدال الدفع':'منح استبدال الدفع'}</button><button class="danger" data-action="delete-user" data-user="${esc(name)}">حذف</button>`:''}</div></div>`).join('')}</div></section></div>`;
      return '';
    }
    function render(){
      document.documentElement.classList.toggle('light',state.theme==='light');state.clock=timeLabel();
      const login=$('#loginScreen'), app=$('#appScreen');
      if(!state.user||!state.shift){login.classList.remove('hidden');app.classList.add('hidden');login.innerHTML=loginHTML();}else{login.classList.add('hidden');app.classList.remove('hidden');app.innerHTML=appHTML();}
      $('#modalRoot').innerHTML=state.modal?modalHTML():'';save();
    }

    document.addEventListener('submit',e=>{ if(e.target.id==='loginForm'){e.preventDefault();login(state.loginName,state.loginPassword);} if(e.target.id==='customerForm'){e.preventDefault();saveCustomer(e.target);}if(e.target.id==='expenseForm'){e.preventDefault();saveExpenseFromForm(e.target);}if(e.target.id==='passwordLoginForm'){e.preventDefault();loginFromForm(e.target);}if(e.target.id==='paymentReplaceForm'){e.preventDefault();replacePaymentFromForm(e.target);} });
    document.addEventListener('input',e=>{const el=e.target;if(el.dataset.input==='search'){state.search=el.value;render();}if(el.dataset.input==='barcode')state.barcodeInput=el.value;if(el.dataset.input==='opening')state.openingInput=el.value;if(el.dataset.input==='custom')state.customPrice=el.value;if(el.name==='username')state.loginName=el.value;if(el.name==='password')state.loginPassword=el.value;if(e.target.name==='paymentInvoiceSearch')state.paymentInvoiceSearch=e.target.value;});
    document.addEventListener('change',e=>{if(e.target.dataset.input==='csv'&&e.target.files[0])importCSV(e.target.files[0]);if(e.target.dataset.input==='branch')setBranch(e.target.value);if(e.target.dataset.input==='barcode')state.barcodeInput=e.target.value;});
    document.addEventListener('keydown',e=>{if(e.target.dataset.input==='barcode'&&e.key==='Enter'){e.preventDefault();scanBarcode(e.target.value)}});
    document.addEventListener('click',e=>{
      const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
      if(action==='quick-login')quickLogin(el.dataset.user);else if(action==='start-shift')startShift();else if(action==='logout')logout();else if(action==='theme'){state.theme=state.theme==='dark'?'light':'dark';render();}else if(action==='updates')checkForUpdates(true);else if(action==='sync-retry')retrySyncQueue(true);else if(action==='settings')showModal('settings');else if(action==='customer')showModal('customer');else if(action==='customer-clear')clearCustomer();else if(action==='report')showModal('report');else if(action==='daily-report')showModal('dailyReport');else if(action==='payment-replace-open')openPaymentReplacement();else if(action==='payment-replace-search')searchPaymentInvoice();else if(action==='payment-permission')togglePaymentPermission(el.dataset.user);else if(action==='invoice-pad-open')openInvoicePad();else if(action==='invoice-pad-close')closeInvoicePad();else if(action==='invoice-pad-key')invoicePadKey(el.dataset.key);else if(action==='invoice-pad-search')searchPaymentInvoiceFromPad();else if(action==='admin')showModal('admin');else if(action==='inventory') {if(state.user!=='admin')return toast('إدارة المخزون متاحة للأدمن فقط',true);showModal('inventory');}else if(action==='inventory-export')exportCSV();else if(action==='barcode-pad-open')openBarcodePad();else if(action==='barcode-key')barcodeKey(el.dataset.key);else if(action==='barcode-search')searchBarcodeFromPad();else if(action==='barcode-pad-close')closeBarcodePad();else if(action==='barcode-match')chooseBarcodeMatch(el.dataset.barcode);else if(action==='delete-product')deleteProduct(el.dataset.barcode);else if(action==='stock-adjust')adjustStock(el.dataset.barcode);else if(action==='close')hideModal();else if(action==='service')chooseService(el.dataset.service);else if(action==='price')addPrice(Number(el.dataset.price));else if(action==='product'){const product=state.products.find(p=>p.barcode===el.dataset.barcode);if(product)addProduct(product);}else if(action==='remove')removeItem(el.dataset.id);else if(action==='decrement')decrementItem(el.dataset.id);else if(action==='clear')clearCart();else if(action==='hold')holdBill();else if(action==='restore')restoreBill();else if(action==='checkout')completeSale();else if(action==='reprint')printReceipt();else if(action==='return-toggle')toggleReturn();else if(action==='return-off'){state.returnMode=false;render();}else if(action==='auto-print'){state.autoPrint=!state.autoPrint;render();}else if(action==='width'){state.receiptWidth=el.dataset.width;render();}else if(action==='add-price')addCustomPrice();else if(action==='quote'){const m=state.modal;state.modal=null;render();completeSale(true);state.modal=m;}else if(action==='expense')addExpense();else if(action==='fixed-expense')addFixedExpense(el.dataset.expenseType);else if(action==='personal-expense')addPersonalExpense(el.dataset.beneficiary);else if(action==='unrestricted-expense')addUnrestrictedExpense();else if(action==='expense-permission')toggleExpensePermission(el.dataset.user);else if(action==='z-print')printZReport(false);else if(action==='z-close'){if(confirm('هل تمت مطابقة النقدية؟ سيتم إغلاق الوردية وتصفير بياناتها بعد الطباعة.'))printZReport(true);}else if(action==='close-shift')closeShift();else if(action==='add-user')addUser();else if(action==='add-branch')addBranch();else if(action==='inventory-save'){const form=el.closest('form');if(form)saveProduct(form);}else if(action==='password')updatePassword(el.dataset.user);else if(action==='delete-user')removeUser(el.dataset.user);
    });
    setInterval(()=>{if(state.shift){state.clock=timeLabel();const node=$('.top-status');if(node)node.innerHTML=`<span class="dot"></span> الوردية نشطة <span class="metric-sep"></span> ${state.clock}`;}},1000);
    const persisted=read(KEY,null);if(persisted){const normalizeLine=item=>{if(!item||!Number.isFinite(Number(item.price))||!Number.isFinite(Number(item.qty))||Number(item.qty)<=0)return null;return {...item,id:String(item.id||`restored-${Date.now()}-${Math.random().toString(36).slice(2)}`),price:Number(item.price),qty:Math.max(1,Math.floor(Number(item.qty))),barcode:item.barcode?String(item.barcode).trim():undefined,name:item.name?String(item.name):''};};state.prices=Array.isArray(persisted.prices)&&persisted.prices.length?persisted.prices.map(Number).filter(Number.isFinite):state.prices;state.products=(Array.isArray(persisted.products)?persisted.products:[]).map(p=>({...p,branch:p.branch||persisted.branch||'الفرع الرئيسي',quantity:Math.max(0,Number(p.quantity)||0)}));state.sales={...state.sales,...(persisted.sales||{})};state.expenses=Array.isArray(persisted.expenses)?persisted.expenses:[];state.transactions=Array.isArray(persisted.transactions)?persisted.transactions:[];state.paymentChanges=Array.isArray(persisted.paymentChanges)?persisted.paymentChanges:[];state.pendingPaymentChanges=Array.isArray(persisted.pendingPaymentChanges)?persisted.pendingPaymentChanges:[];state.paymentManagers=Array.isArray(persisted.paymentManagers)?persisted.paymentManagers:[];state.expenseManagers=Array.isArray(persisted.expenseManagers)?persisted.expenseManagers:['admin'];state.perfumeSales=Number(persisted.perfumeSales)||0;state.storeName=persisted.storeName||state.storeName;state.invoiceNo=Number(persisted.invoiceNo)||1000;state.customer={name:'',phone:'',note:'',...(persisted.customer||{})};state.branches=Array.isArray(persisted.branches)&&persisted.branches.length?persisted.branches:['الفرع الرئيسي'];state.branch=persisted.branch||state.branches[0];state.cart=Array.isArray(persisted.cart)?persisted.cart.map(normalizeLine).filter(Boolean):[];state.held=Array.isArray(persisted.held)?persisted.held.map(normalizeLine).filter(Boolean):null;state.service=payments.some(p=>p.name===persisted.service)?persisted.service:'نقدي';state.returnMode=Boolean(persisted.returnMode);state.lastReceipt=persisted.lastReceipt||null;if(persisted.shift&&persisted.user){state.shift=true;state.user=persisted.user;state.opening=Number(persisted.opening)||0;state.shiftTime=persisted.shiftTime||'';}}
    render();
    setTimeout(()=>checkForUpdates(false),3000);setTimeout(()=>retryPendingPaymentChanges(),1800);setTimeout(()=>retrySyncQueue(false),2200);
  })();
  </script>
