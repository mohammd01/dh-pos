muted);font-size:11px}.heading p span{padding:0 7px;color:var(--gold)}.metrics{display:flex;align-items:center;gap:19px}.metrics span,.metrics strong{display:block}.metrics span{color:var(--muted);font-size:9px}.metrics strong{margin-top:6px;font-size:16px}.metric-sep{width:1px;height:34px;background:var(--line2)}.banner{display:flex;align-items:center;gap:11px;min-height:52px;margin-bottom:18px;padding:9px 13px;border:1px solid rgba(213,175,114,.2);border-radius:10px;background:linear-gradient(90deg,rgba(213,175,114,.1),rgba(144,12,63,.12))}.banner-icon{display:grid;place-items:center;width:30px;height:30px;color:var(--gold);background:rgba(213,175,114,.12);border-radius:8px}.banner strong,.banner small{display:block}.banner strong{color:var(--gold2);font-size:11px}.banner small{margin-top:2px;color:var(--muted);font-size:10px}.banner button{display:inline-flex;align-items:center;gap:5px;margin-right:auto;padding:6px 9px;color:var(--gold2);background:rgba(213,175,114,.1);border-radius:6px;font-size:9px}.card{position:relative;padding:22px;border:1px solid var(--line);border-top:2px solid rgba(213,175,114,.32);border-radius:13px;background:linear-gradient(145deg,var(--surface),rgba(144,12,63,.025));box-shadow:0 10px 30px rgba(0,0,0,.16)}.card+.card{margin-top:16px}.section-head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:20px}.section-head h2,.cart-head h2{margin:7px 0 0;font-size:19px;letter-spacing:-.04em}.tools{display:flex;align-items:center;gap:10px}.search{display:flex;align-items:center;gap:7px;width:155px;padding:0 10px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:7px}.search input{height:30px;padding:0;border:0;background:transparent;font-size:10px}.count{color:var(--muted2);font-size:9px}.price-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:9px}.price{position:relative;display:flex;min-height:88px;flex-direction:column;align-items:flex-start;justify-     /* Cart */
    .cart{display:flex;flex-direction:column;min-width:0;background:linear-gradient(180deg,var(--surface),rgba(144,12,63,.025));border-right:1px solid var(--line);box-shadow:-10px 0 35px rgba(0,0,0,.08)}.cart-head{display:flex;align-items:flex-end;justify-content:space-between;padding:30px 24px 18px;border-bottom:1px solid var(--line)}.cart-badge{padding:5px 8px;color:var(--gold2);background:rgba(213,175,114,.1);border:1px solid rgba(213,175,114,.17);border-radius:5px;font-size:9px}.cart-controls{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:16px 24px 12px}.cart-controls button{display:flex;align-items:center;justify-content:center;gap:5px;min-height:31px;color:var(--muted);background:var(--surface2);border:1px solid var(--line);border-radius:6px;font-size:9px}.cart-controls button:hover{color:var(--soft);border-color:var(--line2)}.held{color:var(--gold)!important;border-color:rgba(213,175,114,.32)!important}.cart-list{flex:1;min-height:260px;max-height:calc(100vh - 370px);overflow-y:auto;padding:0 24px}.cart-line{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:15px 0;border-bottom:1px solid var(--line);animation:up .24s var(--ease) both}.line-leading{display:flex;align-items:center;gap:9px;min-width:0}.line-leading>div{min-width:0}.line-leading strong,.line-leading small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.line-leading strong{font-size:11px}.line-leading small{margin-top:4px;color:var(--muted);font-size:9px}.remove{display:grid;place-items:center;width:25px;height:25px;color:var(--muted2);background:transparent;border-radius:6px}.remove:hover{color:var(--danger);background:rgba(240,113,121,.09)}.line-total{color:var(--green);font-size:11px;font-weight:800;white-space:nowrap}.return-total{color:var(--danger)}.empty-cart{display:flex;min-height:250px;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);text-align:center}.empty-cart .empty-icon{display:grid;place-items:center;width:52px;height:52px;margin-bottom:13px;color:var(--gold);background:rgba(213,175,114,.08);border:1px dashed rgba(213,175,114,.28);border-radius:50%}.empty-cart strong{font-size:12px}.empty-cart small{max-width:180px;margin-top:7px;color:var(--muted2);font-size:10px;line-height:1.6}.summary{padding:20px 24px 19px;border-top:1px solid var(--line)}.summary-row{display:flex;justify-content:space-between;margin-bottom:9px;color:var(--soft);font-size:10px}.summary-row.muted{color:var(--muted)}.summary-total{display:flex;align-items:baseline;justify-content:space-between;padding:13px 0 16px;margin:8px 0 13px;border-top:1px dashed var(--line2);border-bottom:1px dashed var(--line2);font-size:11px}.summary-total strong{font-size:22px;letter-spacing:-.04em}.selected-pay{display:flex;align-items:center;gap:7px;margin-bottom:12px;color:var(--muted);font-size:9px}.selected-pay b{color:var(--soft)}.selected-pay .check{margin-right:auto}.checkout{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:49px;padding:0 15px;color:#fff7f0;background:linear-gradient(110deg,var(--burgundy2),var(--burgundy));border-radius:9px;box-shadow:0 10px 24px rgba(144,12,63,.28);font-size:12px;font-weight:800}.checkout:hover:not(:disabled){transform:translateY(-2px)}.checkout span{color:rgba(255,255,255,.74);font-size:10px}.cart-actions{display:flex;justify-content:center;flex-wrap:wrap;gap:13px;margin-top:15px}.cart-actions button{display:inline-flex;align-items:center;gap:5px;color:var(--muted);background:transparent;font-size:9px}.cart-actions button:hover{color:var(--soft)}.footer{display:flex;align-items:center;justify-content:space-between;height:36px;padding:0 25px;color:var(--muted2);background:var(--surface);border-top:1px solid var(--line);font-size:9px}.footer span{display:flex;align-items:center;gap:7px}.footer i{color:var(--gold);font-style:normal}


    /* Customer experience upgrade */
    .customer-strip{display:flex;align-items:center;gap:12px;margin-bottom:16px;padding:13px 15px;background:linear-gradient(110deg,rgba(213,175,114,.10),rgba(144,12,63,.12));border:1px solid rgba(213,175,114,.22);border-radius:12px}

    .customer-form{display:grid;gap:12px}.customer-form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.customer-form .field-label{gap:6px}.customer-form textarea,.customer-form input{color:var(--text);background:var(--surface2);border:1px solid var(--line2);border-radius:9px;padding:12px 14px;width:100%;outline:0;resize:vertical}.customer-form textarea{min-height:78px}.customer-form textarea:focus,.customer-form input:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(213,175,114,.1)}.customer-hint{display:flex;align-items:center;gap:8px;padding:10px 12px;color:var(--muted);background:rgba(71,199,140,.07);border:1px solid rgba(71,199,140,.18);border-radius:8px;font-size:10px;line-height:1.6}.customer-hint b{color:var(--green)}
    .z-report-actions{display:flex;gap:10px;margin-top:18px}.z-report-actions .primary{flex:1}.report-kpi{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding:12px 14px;color:var(--soft);background:var(--surface2);border:1px solid var(--line);border-radius:9px;font-size:10px}.report-kpi strong{color:var(--gold2);font-size:16px}

    };

    const cloudClient = window.supabase?.createClient(CLOUD_SUPABASE_URL, CLOUD_SUPABASE_ANON_KEY);
    async function syncSaleToCloud(receipt){
      if(!cloudClient || !receipt || receipt.quote) return;
      const payload = {
        invoice_no: Number(receipt.invoiceNo),
        branch_name: receipt.branch || 'الفرع الرئيسي',
        cashier: receipt.cashier || 'غير محدد',
        payment_method: receipt.service || 'نقدي',
        total_amount: Number(receipt.total || 0)
      };
      const {error} = await cloudClient.from('sales_logs').insert(payload);
      if(error){
        console.error('Supabase sales_logs sync failed:', error);
        toast('تم حفظ البيع محلياً، وتعذرت المزامنة مع التقرير السحابي', true);
      }
    }
    const APP_VERSION = '1.2.0';
    const UPDATE_MANIFEST_URL = 'https://raw.githubusercontent.com/mohammd01/dh-pos/main/version.txt';
    const GITHUB_APP_URL = 'https://github.com/mohammd01/dh-pos/raw/refs/heads/main/index.html';
    let remoteUpdateVersion = '';
    function compareVersions(remote, current){
      const r=String(remote||'0').trim().split('.').map(Number), c=String(current||'0').trim().split('.').map(Number);
      for(let i=0;i<Math.max(r.length,c.length);i++){const rv=Number.isFinite(r[i])?r[i]:0,cv=Number.isFinite(c[i])?c[i]:0;if(rv!==cv)return rv>cv?1:-1;}
      return 0;
    }
    async function checkForUpdates(manual=false){
      try{
        const response=await fetch(`${UPDATE_MANIFEST_URL}?t=${Date.now()}`,{cache:'no-store'});
        if(!response.ok)throw new Error(`HTTP ${response.status}`);
        const remote=(await response.text()).trim();
        remoteUpdateVersion=remote;
        if(compareVersions(remote,APP_VERSION)>0){
          if(state.cart.length){state.notice=`يتوفر تحديث ${remote} — أغلق الفاتورة أو احفظها مؤقتاً قبل التحديث`;render();return;}
          if(confirm(`يتوفر تحديث جديد للمنظومة (${remote})\nالإصدار الحالي: ${APP_VERSION}\n\nسيتم الحفاظ على بيانات المبيعات المحلية. هل تريد التحديث الآن؟`)){
            save();
            if(window.location.protocol==='file:')window.open(GITHUB_APP_URL,'_blank');
            else window.location.reload();
          }
        }else if(manual){toast(`أنت تستخدم أحدث إصدار (${APP_VERSION})`);}
      }catch(error){
        console.warn('GitHub update check failed:',error);
        if(manual)toast('تعذر فحص تحديث GitHub — تحقق من اتصال الإنترنت',true);
      }
    }
    const $ = (selector, root=document) => root.querySelector(selector);
    const esc = (value) => String(value ?? '').replace(/[&<>'"]/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[ch]));
    function read(key, fallback){ try { return JSON.parse(localStorage.getItem(key)) || fallback; } catch { return fallback; } }
    function save(){ localStorage.setItem(KEY, JSON.stringify({prices:state.prices,products:state.products,sales:state.sales,expenses:state.expenses,perfumeSales:state.perfumeSales,transactions:state.transactions,storeName:state.storeName,invoiceNo:state.invoiceNo,shift:state.shift,user:state.user,opening:state.opening,shiftTime:state.shiftTime,customer:state.customer,branches:state.branches,branch:state.branch})); localStorage.setItem(USERS_KEY, JSON.stringify(state.users)); localStorage.setItem('dh-pos-standalone-theme',state.theme); localStorage.setItem('dh-pos-auto-print',String(state.autoPrint)); localStorage.setItem('dh-pos-receipt-width',state.receiptWidth); }
    function money(value){ return `${Math.abs(Number(value)||0).toFixed(2)} د.ل`; }

    function dateLabel(){ return new Intl.DateTimeFormat('ar-LY',{day:'2-digit',month:'short',year:'numeric'}).format(new Date()); }

    function setNotice(text){ state.notice=text; }
    function total(){ return state.cart.reduce((sum,item)=>sum+item.price*item.qty,0); }
    function totalSales(){ return Number(state.sales['نقدي']||0); }
    function totalBank(){ return ['موبي كاش','ادفع لي','يسر','البطاقة المصرفية'].reduce((s,k)=>s+(state.sales[k]||0),0); }
    function totalAllSales(){ return Object.values(state.sales).reduce((sum,value)=>sum+Number(value||0),0); }
    function expensesTotal(){ return state.expenses.reduce((s,e)=>s+e.value,0); }

    function addBranch(){if(state.user!=='admin')return toast('إدارة الفروع متاحة للأدمن فقط',true);const name=prompt('اسم الفرع الجديد:')?.trim();if(!name)return;if(state.branches.includes(name))return toast('هذا الفرع موجود بالفعل',true);state.branches.push(name);state.branch=name;save();render();toast(`تمت إضافة الفرع: ${name}`)}

    function hideModal(){ state.modal=null; render(); }

    function login(name,password){
      name=String(name||'').trim();

    }

    }

{esc(state.notice)}</p></div><div class="metrics"><div><span>إجمالي المبيعات</span><strong>${money(totalSales())}</strong></div><div class="metric-sep"></div><div><span>العطور اليوم</span><strong>${money(state.perfumeSales)}</strong></div></div></div><div class="banner"><div class="banner-icon">▣</div><div><strong>${state.returnMode?'وضع الاسترجاع مفعّل':'وضع البيع العادي'}</strong><small>${state.returnMode?'كل الأسعار الجديدة ستُسجل كاسترجاع نقدي':'اختر سعراً لإضافته مباشرة إلى سلة المبيعات'}</small></div>${state.returnMode?'<button data-action="return-off">إلغاء الوضع ×</button>':''}</div><div class="customer-strip"><div class="customer-avatar">${esc(initial(state.customer.name||'ز'))}</div><div class="customer-meta"><strong>${esc(customerLabel())}</strong><small>${state.customer.phone?esc(state.customer.phone):'لا توجد بيانات اتصال'}${state.customer.note?' · ملاحظة محفوظة':''}</small></div><div class="customer-actions"><button data-action="customer">${state.customer.name?'تعديل البيانات':'إضافة زبون'}</button>${state.customer.name?'<button data-action="customer-clear">مسح</button>':''}</div></div><section class="card"><div class="section-head"><div><span class="eyebrow">التسعير السريع</span><h2>شجرة الأسعار</h2></div><div class="tools"><label class="search">⌕ <input data-input="search" value="${esc(state.search)}" placeholder="بحث في الأسعار"></label><span class="count">${visible.length} فئات</span></div></div><div class="price-grid">${visible.map(p=>`<button class="price" data-action="price" data-price="${p}"><b>${p}</b><small>دينار ليبي</small><i>↗</i></button>`).join('')}</div></section><section class="card products"><div class="section-head compact"><div><span class="eyebrow">المنتجات المستوردة</span><h2>باركود العطور</h2></div><label class="outline">＋ استيراد CSV<input type="file" accept=".csv" data-input="csv" hidden></label></div>${state.products.length?`<div class="product-grid">${state.products.slice(0,4).map(p=>`<button class="product" data-action="product" data-barcode="${esc(p.barcode)}"><span class="product-icon">✦</span><span><b>${esc(p.name)}</b><small>${money(p.price)}</small></span>＋</button>`).join('')}</div>`:'<div class="empty-products">◇ <span>استورد ملف CSV بالترتيب: باركود، اسم الصنف، السعر</span></div>'}</section></main><section class="cart"><div class="cart-head"><div><span class="eyebrow">Current order</span><h2>السلة الحالية</h2></div><span class="cart-badge">${count} عناصر</span></div><div class="cart-controls"><button data-action="hold">⇩ تجميد الفاتورة</button><button data-action="restore" class="${state.held?'held':''}">⇧ استرجاع ${state.held?'<span class="dot"></span>':''}</button></div><div class="cart-list">${state.cart.length?state.cart.map(i=>`<div class="cart-line"><div class="line-leading"><button class="remove" data-action="remove" data-id="${i.id}">×</button><div><strong>${esc(i.name||`فئة سعرية ${Math.abs(i.price)}`)}</strong><small>${i.qty} × ${money(i.price)}</small></div></div><span class="line-total ${i.price<0?'return-total':''}">${i.price<0?'-':''}${money(i.price*i.qty)}</span></div>`).join(''):'<div class="empty-cart"><div class="empty-icon">▱</div><strong>السلة بانتظارك</strong><small>اختر فئة سعرية من اللوحة لإضافة أول عنصر</small></div>'}</div><div class="summary"><div class="summary-row"><span>المجموع الفرعي</span><strong>${money(total())}</strong></div><div class="summary-row muted"><span>الضريبة</span><span>مشمولة</span></div><div class="summary-total"><span>الإجمالي المستحق</span><strong>${money(total())}</strong></div><div class="selected-pay"><span class="payment-icon green">▣</span><span>الدفع عبر <b>${esc(state.service)}</b></span><span class="check">✓</span></div><button class="checkout" data-action="checkout" ${state.cart.length?'':'disabled'}>▣ إتمام البيع <span>${money(total())}</span></button><div class="cart-actions"><button data-action="clear">⌫ تفريغ السلة</button>${state.lastReceipt?'<button data-action="reprint">▣ إعادة الطباعة</button>':''}<button data-action="settings">⚙ المزيد</button></div></div></section></div><footer class="footer"><span><span class="dot"></span> جميع الأنظمة تعمل بشكل طبيعي</span><span>DH POS PRO <i>v1.2.0</i>　 تم التطوير من قبل محمد الغرياني <button data-action="updates" style="margin-right:8px;padding:3px 8px;border:1px solid var(--line);border-radius:6px;background:transparent;color:var(--muted);font:inherit;cursor:pointer">فحص تحديث GitHub</button></span></footer>`;
    }
    function modalHTML(){
      if(state.modal==='customer') return `<div class="backdrop"><section class="modal"><div class="modal-head"><div class="modal-title"><span>♙</span><h2>بيانات الزبون</h2></div><button class="icon-btn" data-action="close">×</button></div><div class="customer-hint"><b>●</b><span>احفظ بيانات الزبون لإظهارها في الفاتورة وتسهيل خدمة ما بعد البيع.</span></div><form id="customerForm" class="customer-form"><div class="customer-form-grid"><label class="field-label">اسم الزبون<input name="customerName" value="${esc(state.customer.name)}" placeholder="مثال: سارة محمد" autocomplete="name" autofocus></label><label class="field-label">رقم الهاتف<input name="customerPhone" value="${esc(state.customer.phone)}" placeholder="09x xxx xxxx" inputmode="tel" autocomplete="tel"></label></div><label class="field-label">ملاحظة الطلب<textarea name="customerNote" placeholder="مقاس، لون، أو ملاحظة خاصة بالطلب">${esc(state.customer.note)}</textarea></label><div style="display:flex;gap:10px;margin-top:3px"><button class="primary" type="submit" style="flex:1">حفظ البيانات ✓</button><button class="outline" type="button" data-action="close">إلغاء</button></div></form></section></div>`;
      if(state.modal==='shift') return `<div class="backdrop"><section class="modal"><div class="modal-head"><div class="modal-title"><span>◷</span><h2>بداية الوردية</h2></div></div><div class="intro"><span class="disc">▣</span><p>أدخل المبلغ النقدي الافتتاحي الموجود في الخزينة قبل بدء العمل.</p></div><label class="field-label">الرصيد الافتتاحي<input data-input="opening" type="number" value="${esc(state.openingInput)}" placeholder="0.00" autofocus></label><button class="primary full" data-action="start-shift">تأكيد وبدء العمل ✓</button></section></div>`;
      if(state.modal==='settings') return `<div class="backdrop"><section class="modal"><div class="modal-head"><div class="modal-title"><span>⚙</span><h2>الإعدادات والعمليات</h2></div><button class="icon-btn" data-action="close">×</button></div><div class="settings"><div class="setting"><div><strong>وضع الاسترجاع</strong><small>تحويل الأسعار إلى قيم سالبة للبيع النقدي</small></div><button class="switch ${state.returnMode?'on':''}" data-action="return-toggle"><span></span></button></div><div class="setting"><div><strong>الطباعة التلقائية</strong><small>إرسال الفاتورة للطابعة بعد نجاح الدفع مباشرة</small></div><button class="switch ${state.autoPrint?'on':''}" data-action="auto-print"><span></span></button></div><div class="setting"><div><strong>مقاس الفاتورة</strong><small>مقاس ثابت مطابق للنموذج: 70 × 70 مم</small></div><div class="inline"><button class="active" disabled>70</button></div></div><div class="setting"><div><strong>إضافة فئة سعرية</strong><small>أضف سعراً جديداً لشجرة البيع السريع</small></div><div class="inline"><input data-input="custom" type="number" value="${esc(state.customPrice)}" placeholder="السعر"><button data-action="add-price">＋</button></div></div><button class="setting-action" data-action="quote">▤<span><b>إنشاء عرض أسعار</b><small>طباعة نسخة غير ملزمة للعميل</small></span>‹</button><button class="setting-action" data-action="expense">▣<span><b>إضافة مصروف</b><small>تسجيل مصروف جديد في حركة الوردية</small></span>‹</button><button class="setting-action danger" data-action="close-shift">▣<span><b>إغلاق الوردية</b><small>إنهاء الوردية وإظهار تقرير Z</small></span>‹</button></div></section></div>`;
      if(state.modal==='zreport') return `<div class="backdrop"><section class="modal wide"><div class="modal-head"><div class="modal-title"><span>▥</span><h2>تقرير Z-Report التفصيلي</h2></div><button class="icon-btn" data-action="close">×</button></div><div class="report-hero"><div><span class="eyebrow">تقرير طويل في ورقة واحدة</span><strong>${money(totalSales())}</strong><small>إجمالي المبيعات · ${state.expenses.length} مصروف</small></div><div class="report-art" style="background-image:url('${ASSETS.fabric}')">✦</div></div><div class="report-grid"><div><span>النقدية المتوقعة</span><strong>${money(expectedCash())}</strong><small>افتتاحي + نقدي - مصاريف</small></div><div><span>المبيعات المصرفية</span><strong>${money(totalBank())}</strong><small>كل طرق الدفع غير النقدية</small></div><div><span>مبيعات العطور</span><strong>${money(state.perfumeSales)}</strong><small>من المنتجات الممسوحة</small></div><div><span>المصاريف</span><strong style="color:var(--danger)">${money(expensesTotal())}</strong><small>${state.expenses.length} عمليات مسجلة</small></div></div><div class="report-kpi"><span>الطباعة الافتراضية</span><strong>ورقة طويلة واحدة</strong></div><div class="report-details"><div><span>الكاشير</span><b>${esc(state.user)}</b></div><div><span>فتح الوردية</span><b>${esc(state.shiftTime||'—')}</b></div><div><span>التاريخ</span><b>${dateLabel()}</b></div></div><div class="z-report-actions"><button class="primary" data-action="z-print">▣ طباعة التقرير فقط</button><button class="outline danger" data-action="z-close">طباعة وإغلاق الوردية</button></div><p class="note">طباعة التقرير فقط لا تصفر المبيعات ولا تسجل خروج الكاشير. اختر إغلاق الوردية فقط بعد المطابقة الفعلية للنقدية.</p></section></div>`;
      if(state.modal==='report') return `<div class="backdrop"><section class="modal wide"><div class="modal-head"><div class="modal-title"><span>▥</span><h2>تقرير الوردية المباشر</h2></div><button class="icon-btn" data-action="close">×</button></div><div class="report-hero"><div><span class="eyebrow">تقرير يومي موحد</span><strong>${money(totalSales())}</strong><small>إجمالي Cash فقط</small></div><div class="report-art" style="background-image:url('${ASSETS.fabric}')">✦</div></div><div class="report-grid"><div><span>Cash / نقدي</span><strong>${money(state.sales['نقدي'])}</strong><small>المبيعات النقدية فقط</small></div><div><span>Mobile Cash</span><strong>${money(state.sales['موبي كاش'])}</strong><small>مدفوعات مصرفية</small></div><div><span>تفعيلي</span><strong>${money(state.sales['ادفع لي'])}</strong><small>ادفع لي / اتصالية</small></div><div><span>يسر</span><strong>${money(state.sales['يسر'])}</strong><small>مدفوعات مصرفية</small></div><div><span>بطاقة</span><strong>${money(state.sales['البطاقة المصرفية'])}</strong><small>البطاقة المصرفية</small></div><div><span>إجمالي المصرفي</span><strong>${money(totalBank())}</strong><small>كل غير النقدي</small></div><div><span>إجمالي المدفوعات</span><strong>${money(totalAllSales())}</strong><small>Cash + المصرفي</small></div><div><span>النقدية المتوقعة</span><strong>${money(expectedCash())}</strong><small>افتتاحي + Cash - مصاريف</small></div><div><span>مبيعات العطور</span><strong>${money(state.perfumeSales)}</strong><small>من المنتجات الممسوحة</small></div><div><span>المصاريف</span><strong style="color:var(--danger)">${money(expensesTotal())}</strong><small>${state.expenses.length} عمليات مسجلة</small></div></div><div class="report-details"><div><span>الفرع</span><b>${esc(state.branch||'الفرع الرئيسي')}</b></div><div><span>الكاشير</span><b>${esc(state.user)}</b></div><div><span>الوردية</span><b><span class="dot"></span> نشطة الآن</b></div><div><span>فتح الوردية</span><b>${esc(state.shiftTime||'—')}</b></div><div><span>الفواتير</span><b>${state.transactions.length} فاتورة</b></div><div><span>التاريخ</span><b>${dateLabel()}</b></div></div></section></div>`
      if(state.modal==='admin') return `<div class="backdrop"><section class="modal wide"><div class="modal-head"><div class="modal-title"><span>♙</span><h2>إدارة المستخدمين</h2></div><button class="icon-btn" data-action="close">×</button></div><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:15px;color:var(--muted);font-size:11px"><span>${Object.keys(state.users).length} حسابات مسجلة</span><button class="outline" data-action="add-user">＋ إضافة كاشير</button></div><div class="setting" style="margin-bottom:14px"><div><strong>فرع الفاتورة الحالي</strong><small>يظهر اسم الفرع المختار في كل فاتورة جديدة</small></div><div class="inline"><select data-input="branch" style="min-height:32px;padding:0 8px;color:var(--text);background:var(--surface2);border:1px solid var(--line2);border-radius:7px">${state.branches.map(b=>`<option value="${esc(b)}" ${state.branch===b?'selected':''}>${esc(b)}</option>`).join('')}</select><button data-action="add-branch">＋ فرع</button></div></div><div class="user-list">${Object.keys(state.users).map(name=>`<div class="user-row"><div class="user-info"><span class="avatar">${name==='admin'?'⌘':esc(initial(name))}</span><span><b>${esc(name)}</b><small>${name==='admin'?'مدير النظام':state.users[name]?'محمي بكلمة مرور':'دخول سريع'}</small></span></div><div class="row-actions"><button data-action="password" data-user="${esc(name)}">كلمة السر</button>${name!=='admin'?`<button class="danger" data-action="delete-user" data-user="${esc(name)}">حذف</button>`:''}</div></div>`).join('')}</div></section></div>`;
      return '';
    }
    function render(){
      document.documentElement.classList.toggle('light',state.theme==='light');state.clock=timeLabel();
      const login=$('#loginScreen'), app=$('#appScreen');
      if(!state.user||!state.shift){login.classList.remove('hidden');app.classList.add('hidden');login.innerHTML=loginHTML();}else{login.classList.add('hidden');app.classList.remove('hidden');app.innerHTML=appHTML();}
      $('#modalRoot').innerHTML=state.modal?modalHTML():'';save();
    }

    document.addEventListener('submit',e=>{ if(e.target.id==='loginForm'){e.preventDefault();login(state.loginName,state.loginPassword);} if(e.target.id==='customerForm'){e.preventDefault();saveCustomer(e.target);} });
    document.addEventListener('input',e=>{const el=e.target;if(el.dataset.input==='search'){state.search=el.value;render();}if(el.dataset.input==='opening')state.openingInput=el.value;if(el.dataset.input==='custom')state.customPrice=el.value;if(el.name==='username')state.loginName=el.value;if(el.name==='password')state.loginPassword=el.value;});
    document.addEventListener('change',e=>{if(e.target.dataset.input==='csv'&&e.target.files[0])importCSV(e.target.files[0]);if(e.target.dataset.input==='branch')setBranch(e.target.value);});
    document.addEventListener('click',e=>{
      const el=e.target.closest('[data-action]');if(!el)return;const action=el.dataset.action;
      if(action==='quick-login')quickLogin(el.dataset.user);else if(action==='start-shift')startShift();else if(action==='logout')logout();else if(action==='theme'){state.theme=state.theme==='dark'?'light':'dark';render();}else if(action==='updates')checkForUpdates(true);else if(action==='settings')showModal('settings');else if(action==='customer')showModal('customer');else if(action==='customer-clear')clearCustomer();else if(action==='report')showModal('report');else if(action==='admin')showModal('admin');else if(action==='close')hideModal();else if(action==='service')chooseService(el.dataset.service);else if(action==='price')addPrice(Number(el.dataset.price));else if(action==='product'){const product=state.products.find(p=>p.barcode===el.dataset.barcode);if(product)addProduct(product);}else if(action==='remove')removeItem(el.dataset.id);else if(action==='clear')clearCart();else if(action==='hold')holdBill();else if(action==='restore')restoreBill();else if(action==='checkout')completeSale();else if(action==='reprint')printReceipt();else if(action==='return-toggle')toggleReturn();else if(action==='return-off'){state.returnMode=false;render();}else if(action==='auto-print'){state.autoPrint=!state.autoPrint;render();}else if(action==='width'){state.receiptWidth=el.dataset.width;render();}else if(action==='add-price')addCustomPrice();else if(action==='quote'){const m=state.modal;state.modal=null;render();completeSale(true);state.modal=m;}else if(action==='expense')addExpense();else if(action==='z-print')printZReport(false);else if(action==='z-close'){if(confirm('هل تمت مطابقة النقدية؟ سيتم إغلاق الوردية وتصفير بياناتها بعد الطباعة.'))printZReport(true);}else if(action==='close-shift')closeShift();else if(action==='add-user')addUser();else if(action==='add-branch')addBranch();else if(action==='password')updatePassword(el.dataset.user);else if(action==='delete-user')removeUser(el.dataset.user);
    });
    setInterval(()=>{if(state.shift){state.clock=timeLabel();const node=$('.top-status');if(node)node.innerHTML=`<span class="dot"></span> الوردية نشطة <span class="metric-sep"></span> ${state.clock}`;}},1000);
    const persisted=read(KEY,null);if(persisted){state.prices=persisted.prices||state.prices;state.products=persisted.products||[];state.sales={...state.sales,...(persisted.sales||{})};state.expenses=persisted.expenses||[];state.transactions=persisted.transactions||[];state.perfumeSales=persisted.perfumeSales||0;state.storeName=persisted.storeName||state.storeName;state.invoiceNo=persisted.invoiceNo||1000;state.customer={name:'',phone:'',note:'',...(persisted.customer||{})};state.branches=persisted.branches?.length?persisted.branches:['الفرع الرئيسي'];state.branch=persisted.branch||state.branches[0];if(persisted.shift&&persisted.user){state.shift=true;state.user=persisted.user;state.opening=persisted.opening||0;state.shiftTime=persisted.shiftTime||'';}}
    render();
    setTimeout(()=>checkForUpdates(false),3000);
  })();
  </script>
</body>
